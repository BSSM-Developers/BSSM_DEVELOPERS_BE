name: Docker Build & Deploy

on:
  push:
    branches:
      - 'release-*'
      - 'dev-*'

env:
  APP_IMAGE: donghyunking/bssm-dev-app

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      env: ${{ steps.set-env.outputs.env }}
    steps:
      - uses: actions/checkout@v4

      - name: Set deployment environment
        id: set-env
        run: |
          if [[ "${{ github.ref_name }}" == release-* ]]; then
            echo "env=prod" >> $GITHUB_OUTPUT
          else
            echo "env=staging" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build JAR
        run: |
          chmod +x gradlew
          ./gradlew :app:bootJar --no-daemon

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: app/Dockerfile
          push: true
          tags: ${{ env.APP_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

  update-infra:
    needs: build
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ needs.build.outputs.env }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: BSSM-Developers/BSSM_DEVELOPERS_INFRA
          token: ${{ secrets.INFRA_REPO_TOKEN }}

      - name: Update app image digest
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          sed -i -E "s|donghyunking/bssm-dev-app@sha256:[a-f0-9]+|donghyunking/bssm-dev-app@${DIGEST}|g" \
            ${TARGET}/app/deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${TARGET}/app/deployment.yaml
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "chore :: [${TARGET}] app 이미지 업데이트 (${GITHUB_SHA::7})"
          git push
